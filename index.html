<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>samione.fi</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#232323;overflow:hidden}

#logo{
  width:min(80vw,80vh);
  aspect-ratio:1/1.15;
  position:relative;
}

#kuvio{width:100%;height:85%}

#teksti{
  position:absolute;
  width:100%;
  top:50%;
  text-align:center;
  color:#e5e4e9;
  pointer-events:none;
}

h2{margin:0;font:10vw 'Jost',sans-serif}
canvas{display:block}
</style>
</head>

<body>

<div id="logo">
  <div id="kuvio"></div>
  <div id="teksti"><h2>samione</h2></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene(),c=document.getElementById("kuvio"),f=2.8,t=.025;
const mat=new THREE.MeshBasicMaterial({color:0xff7a00});
const cam=new THREE.OrthographicCamera(-f,f,f,-f,.1,50);
cam.position.set(3,3,3);cam.lookAt(0,0,0);

const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));c.appendChild(r.domElement);

const controls=new THREE.OrbitControls(cam,r.domElement);
Object.assign(controls,{enableDamping:true,dampingFactor:.06,enableZoom:false,enablePan:false,autoRotate:true,autoRotateSpeed:.7});

let timer;
controls.addEventListener("start",()=>{controls.autoRotate=false;clearTimeout(timer)});
controls.addEventListener("end",()=>timer=setTimeout(()=>controls.autoRotate=true,3000));

const group=new THREE.Group();scene.add(group);

function edge(a,b){
  const d=new THREE.Vector3().subVectors(b,a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(t,t,d.length(),8),mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  group.add(m);
}

function cube(x,y,z){
  const v=[];
  for(let X of [-.5,.5])for(let Y of [-.5,.5])for(let Z of [-.5,.5])
    v.push(new THREE.Vector3(x+X,y+Y,z+Z));
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){
    const a=v[i],b=v[j];
    if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)+Math.abs(a.z-b.z)==1)edge(a,b);
  }
}

[[-.5,.5,-.5],[.5,-.5,-.5],[-.5,-.5,.5]].forEach(p=>cube(...p));

function resize(){
  const w=c.clientWidth,h=c.clientHeight,a=w/h;
  cam.left=-f*(a>1?a:1);cam.right=f*(a>1?a:1);
  cam.top=f*(a<1?1/a:1);cam.bottom=-f*(a<1?1/a:1);
  cam.updateProjectionMatrix();r.setSize(w,h);
}
addEventListener("resize",resize);resize();

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  r.render(scene,cam);
})();
</script>
</body>
</html>
